jobName: microduck-adaptive-wave1-battery-c72423f
description: Frozen six-bucket battery for completed canonical and wave-1 checkpoints
accessType: PRIVATE
imageConfig:
  imageUrl: micr.cloud.mioffice.cn/cc-proxy/thelastfoot-openpi-g2-training:microduck-rl-cuda128-20260829-0503
  imageCommand: |
    set -euo pipefail
    export PYTHONUNBUFFERED=1
    export PYTHONPATH=/mnt/cloudml/source/src
    battery=/mnt/cloudml/source/scripts/run_adaptive_capability_battery.py
    for branch in control static com headcom composed; do
      onnx=$(find "/mnt/cloudml/input/${branch}" -type f -name '*.onnx' | sort | tail -n 1)
      test -n "$onnx"
      /opt/microduck_rl/.venv/bin/python "$battery" --onnx "$onnx" --output "/mnt/cloudml/output/${branch}" --duration-seconds 6.0
    done
queueId: '11759'
priority: 5
framework: pytorch
resourceConfigs:
  - nodeRole: worker
    nodeNumber: 1
    perNodeResourceSpec:
      resourcePriority: GUARANTEED
      resourceName: cloudml.ng1r49-8-8.13-107
      resourceNumber: 1
JuiceFSMountConfigs:
  - Volume: robot-intelligent-planning-data
    JuiceFSCluster: wlcb-cloudml
    SubPath: /dongxu/microduck_rl/source/adaptive-curriculum/c72423f
