# Fill these values only after the selected runtime passes the headless probe.
# IsaacLab remains outside the root uv lock so mjlab dependency resolution is
# unchanged.
runtime = "microduck-isaaclab:3.0.0-beta2.patch1-isaacsim6.0.1"
isaaclab_version = "3.0.0-beta2.patch1"
isaacsim_version = "6.0.1"
python_version = "3.12"
torch_version = "2.10.0"
cuda_version = "12.8"
installation = "official_docker_image"
launcher_env = "ISAACLAB_LAUNCHER or ISAACSIM_PYTHON"
isaaclab_source = "https://github.com/isaac-sim/IsaacLab.git"
isaaclab_source_tag = "v3.0.0-beta2.patch1"
isaaclab_source_revision = "ffff603eafc6b74264a5261cc0183d6a65390d78"

[validation]
status = "passed"
headless_probe = "scripts/isaaclab/docker-run.sh -lc 'PYTHONPATH=/workspace/microduck_rl/src:/workspace/IsaacLab/source/isaaclab:/workspace/IsaacLab/source/isaaclab_rl:/workspace/IsaacLab/source/isaaclab_assets:/workspace/IsaacLab/source/isaaclab_physx:/workspace/IsaacLab/source/isaaclab_tasks:/workspace/IsaacLab/source/isaaclab_contrib:/workspace/IsaacLab/source/isaaclab_newton:/workspace/IsaacLab/source/isaaclab_ov:/workspace/IsaacLab/source/isaaclab_ovphysx /isaac-sim/python.sh /workspace/microduck_rl/scripts/isaaclab/probe.py --headless'"
asset_conversion = "scripts/isaaclab/docker-run.sh -lc 'PYTHONPATH=/workspace/microduck_rl/src:/workspace/IsaacLab/source/isaaclab:/workspace/IsaacLab/source/isaaclab_rl:/workspace/IsaacLab/source/isaaclab_assets:/workspace/IsaacLab/source/isaaclab_physx:/workspace/IsaacLab/source/isaaclab_tasks:/workspace/IsaacLab/source/isaaclab_contrib:/workspace/IsaacLab/source/isaaclab_newton:/workspace/IsaacLab/source/isaaclab_ov:/workspace/IsaacLab/source/isaaclab_ovphysx /isaac-sim/python.sh scripts/isaaclab/convert_mjcf.py <input.xml> <output.usd> --headless'"
velocity_flat_random_smoke = "scripts/isaaclab/docker-run.sh -lc 'PYTHONPATH=/workspace/microduck_rl/src:/workspace/IsaacLab/source/isaaclab:/workspace/IsaacLab/source/isaaclab_rl:/workspace/IsaacLab/source/isaaclab_assets:/workspace/IsaacLab/source/isaaclab_physx:/workspace/IsaacLab/source/isaaclab_tasks:/workspace/IsaacLab/source/isaaclab_contrib:/workspace/IsaacLab/source/isaaclab_newton:/workspace/IsaacLab/source/isaaclab_ov:/workspace/IsaacLab/source/isaaclab_ovphysx /isaac-sim/python.sh scripts/isaaclab/velocity_flat_smoke.py --headless --num-envs 64 --steps 20 --output .cache/isaaclab-assets/velocity_flat_smoke_64_prestartup.json'"
velocity_flat_ppo_smoke = "scripts/isaaclab/docker-run.sh (write mode; PYTHONPATH includes /workspace/IsaacLab/source/isaaclab_rl:/workspace/IsaacLab/source/isaaclab_newton:/workspace/IsaacLab/source/isaaclab_ovphysx) + IsaacLab rsl_rl/train.py --external_callback isaaclab_microduck.tasks.register_tasks --task IsaacLab-Velocity-Flat-MicroDuck --num_envs 64 --max_iterations 5 --headless --device cuda:0; output: logs/rsl_rl/microduck_isaaclab_velocity_flat_smoke/"
