# Fill these values only after the selected runtime passes the headless probe.
# IsaacLab remains outside the root uv lock so mjlab dependency resolution is
# unchanged.
runtime = "microduck-isaaclab:3.0.0-isaacsim6.0.1"
isaaclab_version = "3.0.0"
isaacsim_version = "6.0.1"
python_version = "3.12"
torch_version = "2.10.0"
cuda_version = "12.8"
warp_version = "1.16.0"
newton_version = "1.5.1"
installation = "official_docker_image"
launcher_env = "ISAACLAB_LAUNCHER or ISAACSIM_PYTHON"
isaaclab_source = "https://github.com/isaac-sim/IsaacLab.git"
isaaclab_source_ref = "release/3.0.0"
isaaclab_source_revision = "c7fd163736878a4a348a63880ff6001ea8b3143e"

[validation]
status = "passed"
headless_probe = "scripts/isaaclab/docker-run.sh -lc 'PYTHONPATH=/workspace/microduck_rl/src:/workspace/IsaacLab/source/isaaclab:/workspace/IsaacLab/source/isaaclab_rl:/workspace/IsaacLab/source/isaaclab_assets:/workspace/IsaacLab/source/isaaclab_physx:/workspace/IsaacLab/source/isaaclab_tasks:/workspace/IsaacLab/source/isaaclab_contrib:/workspace/IsaacLab/source/isaaclab_newton:/workspace/IsaacLab/source/isaaclab_ov:/workspace/IsaacLab/source/isaaclab_ovphysx:/workspace/IsaacLab/source/isaaclab_visualizers /isaac-sim/python.sh /workspace/microduck_rl/scripts/isaaclab/probe.py'"
asset_conversion = "scripts/isaaclab/docker-run.sh -lc 'PYTHONPATH=/workspace/microduck_rl/src:/workspace/IsaacLab/source/isaaclab:/workspace/IsaacLab/source/isaaclab_rl:/workspace/IsaacLab/source/isaaclab_assets:/workspace/IsaacLab/source/isaaclab_physx:/workspace/IsaacLab/source/isaaclab_tasks:/workspace/IsaacLab/source/isaaclab_contrib:/workspace/IsaacLab/source/isaaclab_newton:/workspace/IsaacLab/source/isaaclab_ov:/workspace/IsaacLab/source/isaaclab_ovphysx:/workspace/IsaacLab/source/isaaclab_visualizers /isaac-sim/python.sh scripts/isaaclab/convert_mjcf.py <input.xml> <output.usd> --headless'"
velocity_flat_random_smoke = "scripts/isaaclab/docker-run.sh -lc 'PYTHONPATH=/workspace/microduck_rl/src:/workspace/IsaacLab/source/isaaclab:/workspace/IsaacLab/source/isaaclab_rl:/workspace/IsaacLab/source/isaaclab_assets:/workspace/IsaacLab/source/isaaclab_physx:/workspace/IsaacLab/source/isaaclab_tasks:/workspace/IsaacLab/source/isaaclab_contrib:/workspace/IsaacLab/source/isaaclab_newton:/workspace/IsaacLab/source/isaaclab_ov:/workspace/IsaacLab/source/isaaclab_ovphysx:/workspace/IsaacLab/source/isaaclab_visualizers /isaac-sim/python.sh scripts/isaaclab/velocity_flat_smoke.py --num-envs 64 --steps 20 --output .cache/isaaclab-assets/velocity_flat_smoke_64_prestartup.json'"
velocity_flat_ppo_smoke = "scripts/isaaclab/docker-run.sh (write mode; PYTHONPATH includes /workspace/IsaacLab/source/isaaclab_rl:/workspace/IsaacLab/source/isaaclab_newton:/workspace/IsaacLab/source/isaaclab_ovphysx:/workspace/IsaacLab/source/isaaclab_visualizers) + /isaac-sim/python.sh scripts/isaaclab/rl_launcher.py train --rl_library rsl_rl --task IsaacLab-Velocity-Flat-MicroDuck --num_envs 64 --max_iterations 5 --device cuda:0; output: logs/rsl_rl/microduck_isaaclab_velocity_flat_smoke/"
velocity_flat_play_video = "scripts/isaaclab/docker-run.sh (write mode; PYTHONPATH includes /workspace/IsaacLab/source/isaaclab_rl:/workspace/IsaacLab/source/isaaclab_newton:/workspace/IsaacLab/source/isaaclab_ovphysx:/workspace/IsaacLab/source/isaaclab_visualizers) + /isaac-sim/python.sh scripts/isaaclab/rl_launcher.py play --rl_library rsl_rl --task IsaacLab-Velocity-Flat-MicroDuck --checkpoint <model.pt> --num_envs 1 --video --video_length 32 --viz kit --device cuda:0; output: logs/rsl_rl/microduck_isaaclab_velocity_flat_smoke/<run>/videos/play/"
